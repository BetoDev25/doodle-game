<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle Duel - Drawing Tool</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
          integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="/js/drawing.js" defer></script>
</head>

<body>
    <div class="container">
        <!-- Tools Panel -->
        <section class="tools-board">
            <!-- Drawing Tools -->
            <div class="row">
                <label class="title"><strong>Tools</strong></label>
                <ul class="options">
                    <li class="option active tool" id="brush">
                        <i class="fas fa-paint-brush"></i>
                        <span>Brush</span>
                    </li>
                    <li class="option tool" id="eraser">
                        <i class="fas fa-eraser"></i>
                        <span>Eraser</span>
                    </li>
                </ul>
            </div>

            <!-- Brush Size -->
            <div class="row">
                <label class="title"><strong>Size</strong></label>
                <ul class="options">
                    <li class="option">
                        <input type="range" id="size-slider" min="1" max="30" value="5">
                    </li>
                </ul>
            </div>

            <!-- Colors -->
            <div class="row colors">
                <label class="title"><strong>Colors</strong></label>
                <ul class="options">
                    <li class="option" style="background-color: #000000;"></li>
                    <li class="option selected" style="background-color: #FF0000;"></li>
                    <li class="option" style="background-color: #0000FF;"></li>
                    <li class="option" style="background-color: #00FF00;"></li>
                    <li class="option" style="background-color: #FFA500;"></li>
                    <li class="option" style="background-color: #800080;"></li>
                    <li class="option">
                        <input type="color" id="color-picker" value="#FF0000">
                    </li>
                </ul>
            </div>

            <!-- Actions -->
            <div class="row buttons">
                <button class="clear-canvas">Clear Canvas</button>
                <button class="save-img">Save Image</button>
            </div>
        </section>

        <!-- Drawing Canvas -->
        <section class="drawing-board">
            <canvas id="drawing-canvas"></canvas>
        </section>
    </div>
</body>

</html>
