<script>
    document.addEventListener("DOMContentLoaded", async () => {
        let currentUser = undefined;
        const response = await fetch('/api/me');
        if (response.ok) {
            const user = await response.json();
            currentUser = user;
        } else {
            window.location.href = "/login.html";
        };
    });
</script>
