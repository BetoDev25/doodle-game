<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title id="page-title">Profile</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/taskbar.css">
    <link rel="stylesheet" href="/css/profile.css">
</head>
<body>
    <nav id="taskbar"></nav>

    <div id="profile-container">
        <!-- Profile Info Section -->
        <div id="profile-header">
            <div id="avatar-container">
                <img id="avatar-img" width="120" height="120" alt="Profile avatar">
                <input type="file" id="avatar-input" accept="image/png,image/jpeg" style="display:none;">
                <div id="avatar-overlay">
                    <button id="avatar-edit-btn">Edit</button>
                </div>
            </div>
            <div id="profile-info">
                <h1 id="profile-username"></h1>
                <p id="profile-created"></p>
                <p id="profile-bio" style="margin-top: 8px; color: #555; font-style: italic;"></p>
            </div>
        </div>

        <!-- Profile Navigation -->
        <div class="mini-nav">
            <a href="#" class="mini-nav-link active mini-nav-link-matches" data-section="matches">Matches</a>
            <a href="#" class="mini-nav-link mini-nav-link-favorites" data-section="favorites">Favorites</a>
        </div>

        <!-- Drawings Section -->
        <div id="drawings-section">
            <div id="drawings-grid"></div>
        </div>
    </div>
    <!-- Modal overlay -->
    <div id="modal-overlay" style="display:none;">
        <div id="modal-content">
            <button id="modal-close">✕</button>
            <div id="modal-body">
                <!-- Drawings will be rendered here -->
            </div>
        </div>
    </div>

    <script src="/js/taskbar.js"></script>
    <script src="/js/profile.js"></script>
</body>
</html>
