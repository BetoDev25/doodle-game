<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Doodle Duel</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/taskbar.css">
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <nav id="taskbar"></nav>

    <div class="auth-container">
        <h1>Sign Up</h1>
        <form id="signupForm" onsubmit="signUp(event)">
            <input type="text" id="username" placeholder="Username" oninput="validateUsername(this.value)" required>
            <div id="usernameError" class="auth-error"></div>

            <input type="password" id="password" placeholder="Password" oninput="validatePassword(this.value)" required>
            <div id="passwordError" class="auth-error"></div>

            <input type="password" id="passwordDupe" placeholder="Retype Password" oninput="passwordEqual(this.value)" required>
            <div id="passwordDupeError" class="auth-error"></div>

            <button type="submit">Sign Up</button>
        </form>
        <div id="message"></div>
        <p class="auth-link">
            <a href="/login/">log in instead</a>
        </p>
    </div>

    <script src="/static/js/utils.js"></script>
    <script src="/static/js/taskbar.js"></script>
    <script>
        localStorage.removeItem('lastRoom');
        localStorage.removeItem('lastRoomData');

        function passwordEqual(val) {
            const val2 = document.getElementById("password").value;
            const errorDiv = document.getElementById("passwordDupeError");
            if (val !== val2) {
                errorDiv.textContent = 'Passwords do not match';
            } else {
                errorDiv.textContent = '';
            }
        }

        function validateUsername(val) {
            const errorDiv = document.getElementById("usernameError");
            if (!val) {
                errorDiv.textContent = 'Username is required';
            } else if (val.length < 4) {
                errorDiv.textContent = 'Username must be at least 4 characters';
            } else if (val.length > 20) {
                errorDiv.textContent = 'Username cannot exceed 20 characters';
            } else if (/\s/.test(val)) {
                errorDiv.textContent = 'Username cannot contain spaces';
            } else {
                errorDiv.textContent = '';
            }
        }

        function validatePassword(val) {
            const errorDiv = document.getElementById("passwordError");
            if (!val) {
                errorDiv.textContent = 'Password is required';
            } else if (val.length < 8) {
                errorDiv.textContent = 'Password must be at least 8 characters';
            } else if (val.length > 40) {
                errorDiv.textContent = 'Password cannot exceed 40 characters';
            } else if (!/[0-9]/.test(val)) {
                errorDiv.textContent = 'Password must contain at least one number';
            } else if (/\s/.test(val)) {
                errorDiv.textContent = 'Password cannot contain spaces';
            } else {
                errorDiv.textContent = '';
            }
        }

        async function signUp(event) {
            event.preventDefault();

            const usernameVal = document.getElementById('username').value;
            const passwordVal = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            const usernameError = document.getElementById('usernameError').textContent;
            const passwordError = document.getElementById('passwordError').textContent;
            const passwordDupeError = document.getElementById('passwordDupeError').textContent;

            if (usernameError || passwordError || passwordDupeError) {
                messageDiv.style.color = 'red';
                messageDiv.textContent = 'Please fix all errors before submitting';
                return;
            }

            if (!usernameVal || !passwordVal) {
                messageDiv.style.color = 'red';
                messageDiv.textContent = 'Please enter both username and password';
                return;
            }

            try {
                const response = await fetch('/api/upgrade-guest', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: usernameVal,
                        password: passwordVal
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.style.color = 'green';
                    messageDiv.textContent = `Success! Account upgraded to "${data.username}"!`;
                    
                    localStorage.removeItem('guestUsername');
                    
                    setTimeout(() => {
                        window.location.href = '/main/';
                    }, 1500);
                } else if (response.status === 409) {
                    messageDiv.style.color = 'red';
                    messageDiv.textContent = 'Username is already taken';
                } else {
                    messageDiv.style.color = 'red';
                    messageDiv.textContent = data.error || 'Failed to create account';
                }
            } catch (error) {
                messageDiv.style.color = 'red';
                messageDiv.textContent = 'Error connecting to server';
                console.error('Signup error:', error);
            }
        }
    </script>
</body>
</html>
