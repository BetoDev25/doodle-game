<h1>Login</h1>
<form onsubmit="login(event)">
    <input type="text" id="username" placeholder="username" onkeypress="if(event.key==='Enter')login(event)">
    <div style="height: 10px;"></div>

    <input type="password" id="password" placeholder="password" onkeypress="if(event.key==='Enter')login(event)">
    <div style="height: 10px;"></div>

    <button type="submit">Log in</button>
    <div id="message" style="margin-top: 10px; color: #333;"></div>
    <p style="margin-top: 10px;">
        <a href="/signup.html">create new user</a>
    </p>
</form>

<script>
    async function login(event) {
        event.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const messageDiv = document.getElementById('message');

        if (!username || !password) {
            messageDiv.style.color = 'red';
            messageDiv.textContent = 'Please enter both username and password';
            return;
        }

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  username: username,
                  password: password  
                })
            });

            console.log('Login response status:', response.status); // DEBUG
            console.log('Login response headers:', response.headers); // DEBUG

            const data = await response.json();
            console.log('Login response data:', data); // DEBUG

            if (response.ok) {
                messageDiv.style.color = 'green';
                messageDiv.textContent = 'Login successful!';

                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);
            } else {
                messageDiv.style.color = 'red';
                messageDiv.textContent = data.error || 'Login failed';
            }
        } catch (error) {
            console.error('Login fetch error:', error); // DEBUG
            console.error('Error details:', error.message); // DEBUG
            console.error('Error stack:', error.stack); // DEBUG
            messageDiv.style.color = 'red';
            messageDiv.textContent = 'Error connecting to server';
        }
    }
</script>
